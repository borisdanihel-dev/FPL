# Secret scan (BUILD_PLAN.md Step 1.6; ruling S1 amendments 1, 3): the
# official gitleaks action, pinned to a full commit SHA (tag v3.0.0, read at
# that commit: src/index.js, src/gitleaks.js, README.md, LICENSE.txt).
#   push to master           scans the pushed commits
#   Sundays 04:23 UTC        scans the full history of every branch
#   Run workflow (dispatch)  scans the full history of every branch
# A full scan covers every branch because gitleaks (8.24.3, the action's
# version) runs `git log --full-history --all` when given no log options, and
# fetch-depth 0 fetches every branch. GitHub runs a push-triggered workflow from
# the pushed commit's own files; the data branch holds no workflow, so a push
# to data cannot start this one (and the nightly's pushes, made with the
# workflow token, start no workflow at all) - data is covered by the weekly and
# manual full scans, and every data commit by fpl_gate.py --secrets.
# .gitleaksignore lists accepted findings, one exact fingerprint each.
# No licence key: the action requires one only for organization accounts, and
# borisdanihel-dev is a personal account (the action checks this itself).
name: secret-scan

on:
  push:
    branches: [master, data]
  schedule:
    - cron: "23 4 * * 0"   # Sundays 04:23 UTC: full history, every branch
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-24.04   # pinned, as the nightly (S1 closing ruling)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1 (ruling S3, point 2)
        with:
          fetch-depth: 0     # every branch, full history

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}   # the action reads the owner's account type
          GITLEAKS_ENABLE_COMMENTS: "false"   # no pull requests here
