# Secret scan (BUILD_PLAN.md Step 1.6; ruling S1 amendment 1, point 6): the
# official gitleaks action, pinned to a full commit SHA (tag v3.0.0, read at
# that commit: src/index.js, src/gitleaks.js, README.md, LICENSE.txt).
#   push to master           scans the pushed commits
#   Run workflow (dispatch)  scans the full history of the branch chosen in
#                            the "branch" input (master or data)
# GitHub runs a push-triggered workflow from the pushed commit's own files; the
# data branch holds no workflow, so a push to data cannot start this one (and
# the nightly's pushes, made with the workflow token, start no workflow at
# all). The data branch is therefore scanned by a dispatch with branch = data.
# No licence key: the action requires one only for organization accounts, and
# borisdanihel-dev is a personal account (the action checks this itself).
name: secret-scan

on:
  push:
    branches: [master, data]
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch whose full history to scan"
        type: choice
        options: [master, data]
        default: master

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}
          fetch-depth: 0     # full history: a dispatch scans every commit

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}   # the action reads the owner's account type
          GITLEAKS_ENABLE_COMMENTS: "false"   # no pull requests here
